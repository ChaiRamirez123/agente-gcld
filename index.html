<!DOCTYPE html>
<html class="light" lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Agente GCLD</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Syne:wght@400..800&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
  body { min-height: 100dvh; font-family: 'DM Sans', sans-serif; }
  #messages { scroll-behavior: smooth; }
  #messages::-webkit-scrollbar { width: 3px; }
  #messages::-webkit-scrollbar-thumb { background: #d4d4d4; border-radius: 2px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #e11d2e; animation: blink 1.4s ease-in-out infinite; display: inline-block; }
  .dot:nth-child(2) { animation-delay: .2s; }
  .dot:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,80%,100%{opacity:.2;transform:scale(.8)} 40%{opacity:1;transform:scale(1)} }
  .scrollbar-hide::-webkit-scrollbar { display: none; }
  .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
  #imgPreviewBar { display: none; }
  textarea { resize: none; font-family: 'DM Sans', sans-serif; }
  .syne { font-family: 'Syne', sans-serif; font-weight: 800; }
  strong.red { color: #e11d2e; font-weight: 700; }
</style>
</head>
<body style="background:#f5f5f5; color:#111111; margin:0;">

<main style="width:100%; max-width:700px; margin:0 auto; display:flex; flex-direction:column; height:100dvh; background:#f5f5f5; box-shadow: 8px 8px 0px 0px #111111; border-left: 4px solid #111; border-right: 4px solid #111; border-bottom: 4px solid #111; overflow:hidden; position:relative;">

  <!-- HEADER -->
  <header style="background:#111111; color:white; padding:12px 16px; border-bottom:4px solid #111; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; z-index:10;">
    <div style="display:flex; align-items:center; gap:12px;">
      <div style="width:40px; height:40px; background:#e11d2e; border-radius:10px; border:2px solid white; display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0;">🐱</div>
      <div>
        <div class="syne" style="color:white; font-size:17px; line-height:1.1; letter-spacing:-0.02em;">Agente GCLD</div>
        <div class="syne" style="color:#e11d2e; font-size:9px; letter-spacing:0.18em; text-transform:uppercase; margin-top:2px;">Gatitos contra la Desigualdad</div>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap:6px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); border-radius:100px; padding:5px 12px;">
      <span style="width:7px; height:7px; border-radius:50%; background:#4ade80; flex-shrink:0; display:inline-block;"></span>
      <span style="font-size:11px; color:white; font-weight:600; white-space:nowrap;">Conectado a Notion vía Make</span>
    </div>
  </header>

  <!-- MESSAGES -->
  <div id="messages" style="flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:14px;"></div>

  <!-- QUICK PROMPTS -->
  <div id="quickPrompts" style="padding:0 16px 10px; display:flex; gap:8px; overflow-x:auto; flex-shrink:0;" class="scrollbar-hide">
    <button onclick="usePrompt('Voy a subir una foto de la cartulina')"
      style="background:white; border:2px solid #111; border-radius:100px; padding:7px 14px; font-family:'Syne',sans-serif; font-weight:800; font-size:12px; color:#111; cursor:pointer; white-space:nowrap; box-shadow:2px 2px 0 #111; transition:all .15s; flex-shrink:0;"
      onmouseover="this.style.background='#e11d2e';this.style.color='white';this.style.borderColor='#e11d2e';"
      onmouseout="this.style.background='white';this.style.color='#111';this.style.borderColor='#111';">
      📸 Foto de cartulina
    </button>
    <button onclick="usePrompt('Tengo resultados del instrumento digital')"
      style="background:white; border:2px solid #111; border-radius:100px; padding:7px 14px; font-family:'Syne',sans-serif; font-weight:800; font-size:12px; color:#111; cursor:pointer; white-space:nowrap; box-shadow:2px 2px 0 #111; transition:all .15s; flex-shrink:0;"
      onmouseover="this.style.background='#e11d2e';this.style.color='white';this.style.borderColor='#e11d2e';"
      onmouseout="this.style.background='white';this.style.color='#111';this.style.borderColor='#111';">
      📊 Resultados digitales
    </button>
    <button onclick="usePrompt('Quiero registrar observaciones de campo')"
      style="background:white; border:2px solid #111; border-radius:100px; padding:7px 14px; font-family:'Syne',sans-serif; font-weight:800; font-size:12px; color:#111; cursor:pointer; white-space:nowrap; box-shadow:2px 2px 0 #111; transition:all .15s; flex-shrink:0;"
      onmouseover="this.style.background='#e11d2e';this.style.color='white';this.style.borderColor='#e11d2e';"
      onmouseout="this.style.background='white';this.style.color='#111';this.style.borderColor='#111';">
      📝 Observaciones
    </button>
  </div>

  <!-- IMAGE PREVIEW -->
  <div id="imgPreviewBar" style="padding:0 16px 8px; flex-shrink:0;">
    <div style="display:inline-flex; align-items:center; gap:8px; background:white; border:2px solid #111; border-radius:100px; padding:4px 12px 4px 4px; box-shadow:2px 2px 0 #111;">
      <img id="imgThumb" style="width:32px; height:32px; border-radius:50%; object-fit:cover; border:1px solid #111;" alt="preview"/>
      <span id="imgName" style="font-size:12px; font-weight:700; color:#111; max-width:140px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;"></span>
      <button onclick="clearImage()" style="background:transparent; border:none; cursor:pointer; color:#111; font-size:18px; line-height:1; padding:0; display:flex; align-items:center;">
        <span class="material-symbols-outlined" style="font-size:18px;">close</span>
      </button>
    </div>
  </div>

  <!-- INPUT AREA -->
  <div style="background:white; border-top:4px solid #111; padding:12px 16px 16px; flex-shrink:0; z-index:10;">
    <div style="display:flex; align-items:flex-end; gap:8px;">
      <input type="file" id="fileInput" accept="image/*" style="display:none;" onchange="handleFile(event)"/>
      <button onclick="document.getElementById('fileInput').click()"
        style="width:44px; height:44px; flex-shrink:0; background:#f5f5f5; border:2px solid #111; display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:2px 2px 0 #111; transition:all .15s;"
        onmouseover="this.style.borderColor='#e11d2e';" onmouseout="this.style.borderColor='#111';">
        <span class="material-symbols-outlined" style="font-size:20px; color:#111; font-variation-settings:'FILL' 0;">attach_file</span>
      </button>
      <textarea id="inputText" placeholder="Escribe un mensaje..."
        oninput="autoResize(this)" onkeydown="handleKey(event)"
        style="flex:1; background:#f5f5f5; border:2px solid #111; padding:10px 14px; font-size:14px; color:#111; min-height:44px; max-height:120px; outline:none; transition:border-color .15s, background .15s;"
        onfocus="this.style.borderColor='#e11d2e';this.style.background='white';"
        onblur="this.style.borderColor='#111';this.style.background='#f5f5f5';"></textarea>
      <button id="sendBtn" onclick="sendMessage()" disabled
        style="width:44px; height:44px; flex-shrink:0; background:#e11d2e; border:2px solid #111; display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:2px 2px 0 #111; transition:all .15s;">
        <span class="material-symbols-outlined" style="font-size:20px; color:white; font-variation-settings:'FILL' 1;">arrow_upward</span>
      </button>
    </div>
    <p style="text-align:center; font-size:11px; color:#a3a3a3; margin-top:8px;">Enter para enviar · 📎 para adjuntar foto</p>
  </div>

</main>

<script>
const WEBHOOK_SESIONES = "https://hook.us2.make.com/w8ss4n7jaudbpmj4swespieayjdrqg8z";
const WEBHOOK_OBSERVACIONES = "https://hook.us2.make.com/gi129fx94jmwll9yq2widh2w8oazkrl6";

const BIENVENIDA = '¡Hola! Soy el agente de datos de GCLD.\n\nPuedo ayudarte a registrar en Notion:\n\n• **Foto de cartulina** — adjunta la imagen y cuento los puntos azules\n• **Resultados digitales** — describe o comparte los votos\n• **Observaciones de campo** — relatos, frases o fricciones\n\n¿Qué quieres registrar hoy?';

const getSystemPrompt = () => {
  const hoy = new Date();
  const hoyISO = hoy.getFullYear() + '-' + String(hoy.getMonth()+1).padStart(2,'0') + '-' + String(hoy.getDate()).padStart(2,'0');
  return `Eres el agente de datos de Gatitos contra la Desigualdad (GCLD), un proyecto de activismo social en Guadalajara, México. Tu función es procesar información de instrumentos de recolección de datos sobre el "tarifazo" (aumento de tarifas de transporte público en Jalisco) y estructurarla para publicarla en Notion.

CONTEXTO DEL PROYECTO:
- El tarifazo afecta principalmente en: Gasto, Tiempo, Injusticia, Saturación, Inseguridad
- Se usan 2 instrumentos: físico (cartulina con puntos azules) y digital (app web con votos)
- Los datos de ambos instrumentos deben consolidarse en un solo registro por sesión

MODOS DE OPERACIÓN:

MODO A — Foto de instrumento físico (cartulina con puntos):
1. Al recibir una imagen, antes de analizarla pregunta en UN solo mensaje: "Para registrar esta cartulina necesito: ¿cuál es el nombre de la sesión, la zona y la fecha? Puedes dármelos todos juntos en un mensaje"
2. Con esa info, analiza la imagen y presenta el conteo detectado aclarando siempre: "Este conteo es una propuesta — por favor verifica y corrígeme si es necesario"
3. Una vez confirmado, genera el bloque de datos estructurado

MODO B — Instrumento digital (screenshot o descripción de resultados):
1. Extrae votos y porcentajes por categoría
2. Pregunta si debe crear registro nuevo o actualizar uno existente
3. Si actualiza, consolida sumando votos físicos + digitales
4. Genera el bloque de datos estructurado

MODO C — Texto libre / observaciones:
1. Clasifica el contenido: relato, fricción observada, frase espontánea, o hallazgo
2. Infiere emoción dominante y tags relevantes del tarifazo
3. Sugiere en qué base guardar (Sesiones u Observaciones)
4. Genera el bloque de datos estructurado

REGLAS IMPORTANTES:
- SIEMPRE confirma los datos con el usuario antes de publicar
- NUNCA publiques sin validación explícita del usuario
- Cuando el usuario confirme, genera el bloque de datos en el formato exacto de abajo, SIN ningún texto introductorio antes del bloque
- NUNCA menciones la palabra "JSON" en tus respuestas — el usuario no sabe qué es eso
- NUNCA escribas encabezados como "Registro listo para publicar" o similares — el sistema los maneja automáticamente
- Cuando confirmes y generes el registro, solo escribe una frase corta de confirmación como "¡Listo! Aquí está el registro:" y luego el bloque de datos
- Usa siempre la palabra "hallazgo" en lugar de "insight"
- NUNCA hagas más de una pregunta por mensaje. Si necesitas varios datos, pregunta uno por uno esperando respuesta entre cada uno
- Si el usuario responde de forma parcial o ambigua, extrae lo que puedas y pregunta SOLO lo que falta
- Si el usuario no tiene zona exacta, usa "Zona no especificada" y continúa
- Si no tiene fecha, usa la fecha de hoy automáticamente sin preguntar
- NUNCA bloquees el flujo por falta de datos secundarios — siempre avanza con valores aproximados
- Si el usuario parece confundido, frustrado o ha respondido con errores dos veces seguidas, abandona el flujo actual y muestra este mensaje exacto: "Empecemos de nuevo 🐱 ¿Qué quieres registrar: una foto de cartulina, resultados digitales u observaciones de campo?"
- Cuando presentes datos de votos, siempre incluye el porcentaje de cada categoría sobre el total, no solo el número absoluto
- Termina siempre con una conclusión interpretativa de una línea: cuál fue la categoría dominante y qué significa

VALIDACIÓN OBLIGATORIA — NUNCA generes el bloque de datos si falta alguno de estos campos:

Para sesión de levantamiento son OBLIGATORIOS:
- nombre_sesion: no puede estar vacío ni ser genérico
- fecha: usa la fecha de hoy si el usuario no especifica
- zona: usa "Zona no especificada" si no la tienen
- fuente: físico, digital o ambos
- votos por categoría: gasto, tiempo, injusticia, saturacion, inseguridad (todos números, mínimo 0)
- hallazgo_principal: al menos una frase corta que resuma lo más importante

Para observación/relato son OBLIGATORIOS:
- relato: texto completo, no puede estar vacío
- tipo: relato, fricción, hallazgo o frase
- emocion_dominante: enojo, frustración, miedo, resignación u otro
- tags: al menos un tag relevante

Nunca uses "..." ni dejes campos vacíos en el bloque final.

Para sesión de levantamiento:
\`\`\`json_notion_sesion
{
  "nombre_sesion": "...",
  "fecha": "YYYY-MM-DD",
  "zona": "...",
  "fuente": "físico|digital|ambos",
  "votos_gasto": 0,
  "votos_tiempo": 0,
  "votos_injusticia": 0,
  "votos_saturacion": 0,
  "votos_inseguridad": 0,
  "total_votos": 0,
  "hallazgo_principal": "...",
  "observaciones": "..."
}
\`\`\`

Para observación/relato:
\`\`\`json_notion_observacion
{
  "relato": "...",
  "tipo": "relato|fricción|hallazgo|frase",
  "emocion_dominante": "enojo|frustración|miedo|resignación|otro",
  "tags": ["tag1", "tag2"],
  "sesion_relacionada": "nombre de sesión o vacío"
}
\`\`\`

Responde siempre en español, de forma clara y amigable. Eres parte del equipo de GCLD.

FECHA DE HOY: ${hoyISO} — usa SIEMPRE esta fecha si el usuario no especifica otra.`;
};

let conversation = [];
let attachedImage = null;
let isLoading = false;

function autoResize(ta) {
  ta.style.height = 'auto';
  ta.style.height = Math.min(ta.scrollHeight, 120) + 'px';
  updateSendBtn();
}

function updateSendBtn() {
  const btn = document.getElementById('sendBtn');
  const txt = document.getElementById('inputText').value.trim();
  const disabled = (!txt && !attachedImage) || isLoading;
  btn.disabled = disabled;
  btn.style.background = disabled ? '#d4d4d4' : '#e11d2e';
  btn.style.boxShadow = disabled ? 'none' : '2px 2px 0 #111';
  btn.style.cursor = disabled ? 'default' : 'pointer';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function usePrompt(text) {
  document.getElementById('inputText').value = text;
  autoResize(document.getElementById('inputText'));
  document.getElementById('inputText').focus();
  updateSendBtn();
}

function handleFile(e) {
  const file = e.target.files[0];
  if (!file || !file.type.startsWith('image/')) return;
  const reader = new FileReader();
  reader.onload = ev => {
    attachedImage = { preview: ev.target.result, name: file.name, base64: ev.target.result.split(',')[1], mediaType: file.type };
    document.getElementById('imgThumb').src = ev.target.result;
    document.getElementById('imgName').textContent = file.name;
    document.getElementById('imgPreviewBar').style.display = 'block';
    updateSendBtn();
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}

function clearImage() {
  attachedImage = null;
  document.getElementById('imgPreviewBar').style.display = 'none';
  document.getElementById('imgThumb').src = '';
  updateSendBtn();
}

function formatText(text) {
  return text
    .replace(/\*\*(.*?)\*\*/g, '<strong style="color:#e11d2e;font-weight:700;">$1</strong>')
    .replace(/\n/g, '<br>');
}

function extractJSON(text) {
  const s = text.match(/```json_notion_sesion\n([\s\S]*?)```/);
  const o = text.match(/```json_notion_observacion\n([\s\S]*?)```/);
  if (s) { try { return { type: 'sesion', data: JSON.parse(s[1]) }; } catch(e){} }
  if (o) { try { return { type: 'observacion', data: JSON.parse(o[1]) }; } catch(e){} }
  return null;
}

function cleanText(text) {
  return text
    .replace(/```json_notion_sesion[\s\S]*?```/g, '')
    .replace(/```json_notion_observacion[\s\S]*?```/g, '')
    .trim();
}

function scrollBottom() {
  const m = document.getElementById('messages');
  m.scrollTop = m.scrollHeight;
}

function addMessage(role, content, imgSrc) {
  const msgs = document.getElementById('messages');
  document.getElementById('quickPrompts').style.display = 'none';
  const wrap = document.createElement('div');

  if (role === 'user') {
    wrap.style.cssText = 'display:flex; flex-direction:column; align-items:flex-end; align-self:flex-end; max-width:85%;';
    wrap.innerHTML = `
      <span style="font-family:'Syne',sans-serif; font-size:9px; font-weight:800; text-transform:uppercase; letter-spacing:0.12em; color:#a3a3a3; margin-bottom:4px; padding:0 4px;">Tú</span>
      <div style="background:#111111; border:2px solid #111; border-radius:16px 16px 4px 16px; padding:12px 16px;">
        ${imgSrc ? `<img src="${imgSrc}" style="max-width:180px; border-radius:8px; margin-bottom:8px; display:block; border:1px solid #333;" alt="adjunto"/>` : ''}
        <p style="font-family:'DM Sans',sans-serif; font-size:14px; color:white; line-height:1.6; margin:0;">${formatText(content)}</p>
      </div>`;
  } else {
    wrap.style.cssText = 'display:flex; flex-direction:column; align-items:flex-start; max-width:85%;';
    wrap.innerHTML = `
      <span style="font-family:'Syne',sans-serif; font-size:9px; font-weight:800; text-transform:uppercase; letter-spacing:0.12em; color:#e11d2e; margin-bottom:4px; padding:0 4px;">Agente GCLD</span>
      <div style="background:white; border:2px solid #111; border-left:4px solid #e11d2e; border-radius:4px 16px 16px 16px; padding:12px 16px; box-shadow:3px 3px 0 #111;">
        <p style="font-family:'DM Sans',sans-serif; font-size:14px; color:#111; line-height:1.6; margin:0;">${formatText(content)}</p>
      </div>`;
  }

  msgs.appendChild(wrap);
  scrollBottom();
}

function addTyping() {
  const msgs = document.getElementById('messages');
  const wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex; flex-direction:column; align-items:flex-start; max-width:85%;';
  wrap.id = 'typing';
  wrap.innerHTML = `
    <span style="font-family:'Syne',sans-serif; font-size:9px; font-weight:800; text-transform:uppercase; letter-spacing:0.12em; color:#e11d2e; margin-bottom:4px; padding:0 4px;">Agente GCLD</span>
    <div style="background:white; border:2px solid #111; border-left:4px solid #e11d2e; border-radius:4px 16px 16px 16px; padding:14px 18px; box-shadow:3px 3px 0 #111; display:flex; gap:5px; align-items:center;">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>`;
  msgs.appendChild(wrap);
  scrollBottom();
}

function removeTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

function addJSONCard(jsonData) {
  const msgs = document.getElementById('messages');
  const wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex; flex-direction:column; align-items:flex-start; max-width:92%;';
  const dataStr = encodeURIComponent(JSON.stringify(jsonData));
  const base = jsonData.type === 'sesion' ? 'sesión de levantamiento' : 'observaciones de campo';
  wrap.innerHTML = `
    <div style="background:white; border:2px solid #111; border-left:4px solid #e11d2e; padding:16px; box-shadow:3px 3px 0 #111; width:100%;">
      <p style="font-family:'Syne',sans-serif; font-weight:800; font-size:17px; color:#111; line-height:1.2; margin:0 0 4px;">¿Guardamos este registro?</p>
      <p style="font-family:'DM Sans',sans-serif; font-size:13px; color:#737373; margin:0 0 14px;">Se guardará como ${base}</p>
      <button class="btn-save" onclick="publishToNotion('${dataStr}', this)"
        style="background:#e11d2e; color:white; border:2px solid #111; font-family:'Syne',sans-serif; font-weight:800; font-size:13px; text-transform:uppercase; padding:10px 20px; box-shadow:3px 3px 0 #111; cursor:pointer; display:flex; align-items:center; gap:8px; transition:all .15s; letter-spacing:0.05em;"
        onmouseover="this.style.background='#b91c1c';" onmouseout="this.style.background='#e11d2e';">
        Guardar en Notion
        <span class="material-symbols-outlined" style="font-size:18px; font-variation-settings:'FILL' 1;">arrow_forward</span>
      </button>
    </div>`;
  msgs.appendChild(wrap);
  scrollBottom();
}

function showBienvenida() {
  setTimeout(() => {
    addMessage('agent', '¿Quieres registrar algo más? Aquí estoy 🐱\n\n• **Foto de cartulina** — adjunta la imagen y cuento los puntos azules\n• **Resultados digitales** — describe o comparte los votos\n• **Observaciones de campo** — relatos, frases o fricciones');
  }, 800);
}

async function publishToNotion(dataStr, btn) {
  const jsonData = JSON.parse(decodeURIComponent(dataStr));
  btn.disabled = true;
  btn.style.background = '#737373';
  btn.style.boxShadow = 'none';
  btn.innerHTML = 'Guardando... <span class="material-symbols-outlined" style="font-size:18px;">progress_activity</span>';
  const webhook = jsonData.type === 'sesion' ? WEBHOOK_SESIONES : WEBHOOK_OBSERVACIONES;
  try {
    const resp = await fetch(webhook, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(jsonData.data)
    });
    const text = await resp.text();
    if (text === 'Accepted' || resp.ok) {
      btn.style.background = '#16a34a';
      btn.innerHTML = '✓ Guardado <span class="material-symbols-outlined" style="font-size:18px; font-variation-settings:\'FILL\' 1;">check_circle</span>';
      const base = jsonData.type === 'sesion' ? 'Sesiones de levantamiento' : 'Observaciones';
      addMessage('agent', `✅ ¡Registro guardado en Notion en la base de ${base}!`);
      showBienvenida();
    } else {
      btn.style.background = '#e11d2e';
      btn.style.boxShadow = '3px 3px 0 #111';
      btn.innerHTML = 'Error — reintentar <span class="material-symbols-outlined" style="font-size:18px;">refresh</span>';
      btn.disabled = false;
    }
  } catch(e) {
    btn.style.background = '#e11d2e';
    btn.style.boxShadow = '3px 3px 0 #111';
    btn.innerHTML = 'Error — reintentar <span class="material-symbols-outlined" style="font-size:18px;">refresh</span>';
    btn.disabled = false;
  }
}

async function sendMessage() {
  const ta = document.getElementById('inputText');
  const text = ta.value.trim();
  if ((!text && !attachedImage) || isLoading) return;

  addMessage('user', text || 'Analiza esta imagen', attachedImage?.preview);

  let apiMsg;
  if (attachedImage) {
    apiMsg = { role: 'user', content: [
      { type: 'image', source: { type: 'base64', media_type: attachedImage.mediaType, data: attachedImage.base64 } },
      { type: 'text', text: text || 'Analiza esta imagen del instrumento y cuenta los puntos azules por columna' }
    ]};
  } else {
    apiMsg = { role: 'user', content: text };
  }
  conversation.push(apiMsg);

  ta.value = '';
  ta.style.height = 'auto';
  clearImage();
  isLoading = true;
  updateSendBtn();
  addTyping();

  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-5',
        max_tokens: 1000,
        system: getSystemPrompt(),
        messages: conversation
      })
    });
    const data = await resp.json();
    const reply = data.content?.[0]?.text || 'Sin respuesta.';
    conversation.push({ role: 'assistant', content: reply });
    removeTyping();
    const clean = cleanText(reply);
    if (clean) addMessage('agent', clean);
    const json = extractJSON(reply);
    if (json) addJSONCard(json);
  } catch(e) {
    removeTyping();
    addMessage('agent', 'Error de conexión. Intenta de nuevo.');
  }

  isLoading = false;
  updateSendBtn();
}

window.onload = () => {
  addMessage('agent', BIENVENIDA);
  document.getElementById('inputText').addEventListener('input', updateSendBtn);
};
</script>
